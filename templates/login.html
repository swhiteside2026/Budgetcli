<!DOCTYPE html>
<html data-theme="{{ current_theme }}" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — BudgetBalancer</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center px-4">

  <div class="card w-full max-w-sm bg-base-100 shadow-xl">
    <div class="card-body gap-0">

      <!-- Brand -->
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-primary mx-auto flex items-center justify-center mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-primary-content" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 10v1m-3-5h6" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight">BudgetBalancer</h1>
        <p class="text-sm text-base-content/50 mt-1">Sign in to your account</p>
      </div>

      <!-- Flash messages -->
      {% with messages = get_flashed_messages(with_categories=True) %}
      {% if messages %}
      <div class="space-y-2 mb-4">
        {% for cat, msg in messages %}
        <div role="alert" class="alert {{ 'alert-success' if cat == 'success' else 'alert-error' if cat == 'error' else 'alert-info' }} py-2 text-sm">
          <span>{{ msg }}</span>
        </div>
        {% endfor %}
      </div>
      {% endif %}
      {% endwith %}

      <!-- Form -->
      <form method="POST" class="space-y-4">
        <label class="form-control w-full">
          <div class="label pb-1"><span class="label-text font-medium">Username</span></div>
          <input type="text" name="username" autocomplete="username"
                 class="input input-bordered w-full" required autofocus />
        </label>

        <label class="form-control w-full">
          <div class="label pb-1"><span class="label-text font-medium">Password</span></div>
          <div class="relative">
            <input type="password" name="password" autocomplete="current-password"
                   class="input input-bordered w-full pr-10" required />
            <button type="button" onclick="togglePassword(this)" aria-label="Show password"
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600 focus:text-gray-600">
              <svg class="eye-show h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg class="eye-hide h-4 w-4 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
        </label>

        <button type="submit" class="btn btn-primary w-full mt-2">Sign In</button>
      </form>

      <div class="text-center mt-4">
        <a href="{{ url_for('forgot_password') }}"
           class="text-sm text-base-content/40 hover:text-primary transition-colors">
          Forgot your password?
        </a>
      </div>

      <p class="text-center text-sm mt-4 text-base-content/50">
        No account yet?
        <a href="{{ url_for('register') }}" class="link link-primary font-medium">Create one</a>
      </p>

    </div>
  </div>

  <script>
  function togglePassword(btn) {
    const input = btn.parentElement.querySelector('input');
    const reveal = input.type === 'password';
    input.type = reveal ? 'text' : 'password';
    btn.querySelector('.eye-show').classList.toggle('hidden', reveal);
    btn.querySelector('.eye-hide').classList.toggle('hidden', !reveal);
    btn.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
  }
  </script>

</body>
</html>
